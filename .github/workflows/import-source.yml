name: Import project source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract source update
        run: |
          unzip -o completion-update.zip
          git rm completion-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoadingStep.tsx src/components/ApplicationDialog.tsx src/application-dialog.css public/assets/application-success-check.svg
          git commit -m "Show Figma completion screen after five seconds in both forms"
          git push
