name: Import project source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract exact success icon update
        run: |
          unzip -o success-icon-fix.zip
          git rm success-icon-fix.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LoadingStep.tsx src/application-dialog.css public/assets/application-success-check.svg
          git commit -m "Use exact Figma check icon in application success screens"
          git push
