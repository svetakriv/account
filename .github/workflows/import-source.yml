name: Import project source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract completion layout fix
        run: |
          unzip -o success-final-fix.zip
          git rm success-final-fix.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application-dialog.css public/assets/application-success-check-v2.svg
          git commit -m "Fit inline success screen and version the exact Figma icon"
          git push
